spring:
  application:
    name: skillpath-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:skillpath}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:skillpath_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:local-skillpath-only}}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"

server:
  servlet:
    session:
      cookie:
        name: SKILLPATH_SESSION
        http-only: true
        secure: ${SKILLPATH_SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

skillpath:
  frontend-origin: ${SKILLPATH_FRONTEND_ORIGIN:http://localhost:5173}
  auth:
    max-failed-attempts: 5
    lock-duration: 15m
    maximum-sessions: 5
  idempotency:
    retention: 24h
