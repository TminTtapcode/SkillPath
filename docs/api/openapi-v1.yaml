openapi: 3.1.0
info:
  title: SkillPath API
  version: v1
  description: SkillPath identity, goal, graph, assessment, progress, review, and learner-selected learning contracts through Phase 5.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      responses:
        '200':
          description: CSRF token metadata for the browser client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated.
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current learner profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/goal-templates:
    get:
      operationId: listGoalTemplates
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Active goal templates.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalTemplateResponse'
  /api/v1/goal-templates/{goalTemplateId}/graph:
    get:
      operationId: getPublishedGoalGraph
      parameters:
        - $ref: '#/components/parameters/GoalTemplateId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: anchorNodeId
          in: query
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, minimum: 0, maximum: 10, default: 2 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Current published graph for the active goal template.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalGraphResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/knowledge/nodes/{nodeId}:
    get:
      operationId: getPublishedKnowledgeNode
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: A node in a published graph.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeNodeResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/knowledge/nodes/{nodeId}/prerequisites:
    get:
      operationId: getPublishedPrerequisites
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Transitive'
        - $ref: '#/components/parameters/GraphLimit'
      responses:
        '200':
          description: Stable direct or transitive prerequisite nodes.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeNodeResponse'
  /api/v1/knowledge/nodes/{nodeId}/dependents:
    get:
      operationId: getPublishedDependents
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Transitive'
        - $ref: '#/components/parameters/GraphLimit'
      responses:
        '200':
          description: Stable direct or transitive dependent nodes.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeNodeResponse'
  /api/v1/admin/knowledge/versions/{versionId}/validate:
    post:
      operationId: validateKnowledgeGraphVersion
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Deterministic validation result; invalid drafts remain drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphValidationResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/knowledge/versions/{versionId}/publish:
    post:
      operationId: publishKnowledgeGraphVersion
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Version published atomically, or replay of the current publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPublicationResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/goals:
    post:
      operationId: createGoal
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Goal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '200':
          description: Original result replayed for the same idempotency key and request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/goals/active:
    get:
      operationId: getActiveGoal
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current active goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/assessments/diagnostic:
    post:
      operationId: startDiagnostic
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: New diagnostic session created with pinned question versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSessionResponse'
        '200':
          description: Existing in-progress or completed diagnostic returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentSessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/assessments/{sessionId}/next-question:
    get:
      operationId: getNextDiagnosticQuestion
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/AssessmentSessionId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Next pinned unanswered question. The answer key is never included.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentQuestionResponse'
        '204':
          description: Diagnostic is completed and has no next question.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
  /api/v1/assessments/{sessionId}/attempts:
    post:
      operationId: submitDiagnosticAttempt
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/AssessmentSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssessmentAttemptRequest'
      responses:
        '201':
          description: Attempt, concept evidence, and durable handoff created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttemptResponse'
        '200':
          description: Original accepted attempt replayed for the same key and payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttemptResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/assessments/{sessionId}/result:
    get:
      operationId: getDiagnosticResult
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/AssessmentSessionId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Observational concept evidence, not authoritative mastery or a recommendation.
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResultResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/knowledge/me:
    get:
      operationId: listMyKnowledgeState
      security: [{ cookieSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Learner-owned effective knowledge-state page.
          content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeStatePageResponse' } } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/knowledge/me/{nodeId}:
    get:
      operationId: getMyKnowledgeState
      security: [{ cookieSession: [] }]
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Learner-owned knowledge state for one concept.
          content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeStateResponse' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/knowledge/me/{nodeId}/evidence:
    get:
      operationId: listMyKnowledgeEvidence
      security: [{ cookieSession: [] }]
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Append-only evidence provenance page.
          content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeEvidencePageResponse' } } }
  /api/v1/reviews/today:
    get:
      operationId: listDueReviews
      security: [{ cookieSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Reviews due at the server clock for the current learner.
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPageResponse' } } }
  /api/v1/admin/progress/rebuild:
    post:
      operationId: rebuildProgress
      security: [{ cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: Deterministic replay completed.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgressRebuildResponse' } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/learning/sequences:
    get:
      operationId: listLearningSequences
      security: [{ cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: Active compatible learner-selected sequences; never a personalized plan.
          headers: { Content-Language: { $ref: '#/components/headers/ContentLanguage' } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LearningSequenceResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/learning/sequences/{key}:
    get:
      operationId: getLearningSequence
      security: [{ cookieSession: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Bounded sequence description.
          headers: { Content-Language: { $ref: '#/components/headers/ContentLanguage' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LearningSequenceResponse' } } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/learning/sequences/{key}/sessions:
    post:
      operationId: startLearningSession
      security: [{ cookieSession: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyHeader' }
      responses:
        '200': { description: Existing or replayed active session, content: { application/json: { schema: { $ref: '#/components/schemas/LearningStartResponse' } } } }
        '201': { description: New learner-selected session, content: { application/json: { schema: { $ref: '#/components/schemas/LearningStartResponse' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/learning/sessions/active:
    get:
      operationId: getActiveLearningSession
      security: [{ cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: Current study session from pinned task snapshots.
          headers: { Content-Language: { $ref: '#/components/headers/ContentLanguage' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LearningSessionResponse' } } }
        '204': { description: No active learner-selected session. }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/learning/sessions/{id}:
    get:
      operationId: getLearningSession
      security: [{ cookieSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
      responses:
        '200':
          description: Owned active or historical study session.
          headers: { Content-Language: { $ref: '#/components/headers/ContentLanguage' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LearningSessionResponse' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/learning/tasks/{id}/start:
    post:
      operationId: startLearningTask
      security: [{ cookieSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }]
      responses: { '200': { description: Task started or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCommandResponse' } } } }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/learning/tasks/{id}/complete:
    post:
      operationId: completeLearningTask
      security: [{ cookieSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCompleteRequest' } } } }
      responses: { '200': { description: Engagement-only completion or replay, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCommandResponse' } } } }, '404': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/v1/learning/tasks/{id}/skip:
    post:
      operationId: skipLearningTask
      security: [{ cookieSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningReasonRequest' } } } }
      responses: { '200': { description: Task skipped and session stopped, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCommandResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/learning/tasks/{id}/blocked:
    post:
      operationId: blockLearningTask
      security: [{ cookieSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningReasonRequest' } } } }
      responses: { '200': { description: Task blocked, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCommandResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/learning/tasks/{id}/resume:
    post:
      operationId: resumeLearningTask
      security: [{ cookieSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }]
      responses: { '200': { description: Blocked task resumed, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCommandResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
  /api/v1/learning/tasks/{id}/abandon:
    post:
      operationId: abandonLearningTask
      security: [{ cookieSession: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }, { $ref: '#/components/parameters/IdempotencyHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningReasonRequest' } } } }
      responses: { '200': { description: Task abandoned and session stopped, content: { application/json: { schema: { $ref: '#/components/schemas/LearningCommandResponse' } } } }, '409': { $ref: '#/components/responses/Problem' } }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: SKILLPATH_SESSION
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred learner presentation language. Unsupported values fall back to English.
      schema:
        type: string
        enum: [vi-VN, en]
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    GoalTemplateId:
      name: goalTemplateId
      in: path
      required: true
      schema: { type: string }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string }
    AssessmentSessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    Transitive:
      name: transitive
      in: query
      schema: { type: boolean, default: false }
    GraphLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
  headers:
    ContentLanguage:
      description: Resolved language used for localized learner content.
      schema:
        type: string
        enum: [vi-VN, en]
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    LearningSequenceStep:
      type: object
      required: [position, activityType, minutes, title]
      properties:
        position: { type: integer, minimum: 1 }
        activityType: { type: string, enum: [LEARN, PRACTICE, RECALL] }
        minutes: { type: integer, minimum: 1 }
        title: { type: string }
    LearningSequenceResponse:
      type: object
      required: [key, version, graphVersionId, title, description, totalMinutes, steps]
      properties:
        key: { type: string }
        version: { type: integer, minimum: 1 }
        graphVersionId: { type: string }
        title: { type: string }
        description: { type: string }
        totalMinutes: { type: integer, minimum: 1 }
        steps: { type: array, items: { $ref: '#/components/schemas/LearningSequenceStep' } }
    LearningChecklistStep:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    LearningTaskResponse:
      type: object
      required: [id, position, status, activityType, evaluationMode, plannedMinutes, title, instructions, resourceTitle, resourceBody, checklist]
      properties:
        id: { type: string }
        position: { type: integer, minimum: 1 }
        status: { type: string, enum: [ASSIGNED, IN_PROGRESS, BLOCKED, COMPLETED, SKIPPED, ABANDONED, EXPIRED] }
        activityType: { type: string, enum: [LEARN, PRACTICE, RECALL] }
        evaluationMode: { type: string, enum: [NONE, SELF_REPORT] }
        plannedMinutes: { type: integer, minimum: 1 }
        actualMinutes: { type: [integer, 'null'], minimum: 0, maximum: 360 }
        title: { type: string }
        instructions: { type: string }
        resourceTitle: { type: string }
        resourceBody: { type: string }
        checklist: { type: array, items: { $ref: '#/components/schemas/LearningChecklistStep' } }
    LearningSessionResponse:
      type: object
      required: [id, sequenceKey, title, status, graphVersionId, assignmentSource, startedAt, tasks]
      properties:
        id: { type: string }
        sequenceKey: { type: string }
        title: { type: string }
        status: { type: string, enum: [ACTIVE, COMPLETED, STOPPED] }
        graphVersionId: { type: string }
        assignmentSource: { type: string, enum: [LEARNER_SELECTED, PLANNER] }
        startedAt: { type: string, format: date-time }
