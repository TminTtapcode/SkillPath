openapi: 3.1.0
info:
  title: SkillPath API
  version: v1
  description: Phase 1 identity/goal and Phase 2 published knowledge-graph contracts.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      responses:
        '200':
          description: CSRF token metadata for the browser client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session invalidated.
  /api/v1/me:
    get:
      operationId: getMe
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current learner profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/goal-templates:
    get:
      operationId: listGoalTemplates
      responses:
        '200':
          description: Active goal templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalTemplateResponse'
  /api/v1/goal-templates/{goalTemplateId}/graph:
    get:
      operationId: getPublishedGoalGraph
      parameters:
        - $ref: '#/components/parameters/GoalTemplateId'
        - name: anchorNodeId
          in: query
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, minimum: 0, maximum: 10, default: 2 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Current published graph for the active goal template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalGraphResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/knowledge/nodes/{nodeId}:
    get:
      operationId: getPublishedKnowledgeNode
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: A node in a published graph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeNodeResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/knowledge/nodes/{nodeId}/prerequisites:
    get:
      operationId: getPublishedPrerequisites
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Transitive'
        - $ref: '#/components/parameters/GraphLimit'
      responses:
        '200':
          description: Stable direct or transitive prerequisite nodes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeNodeResponse'
  /api/v1/knowledge/nodes/{nodeId}/dependents:
    get:
      operationId: getPublishedDependents
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/Transitive'
        - $ref: '#/components/parameters/GraphLimit'
      responses:
        '200':
          description: Stable direct or transitive dependent nodes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeNodeResponse'
  /api/v1/admin/knowledge/versions/{versionId}/validate:
    post:
      operationId: validateKnowledgeGraphVersion
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Deterministic validation result; invalid drafts remain drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphValidationResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/knowledge/versions/{versionId}/publish:
    post:
      operationId: publishKnowledgeGraphVersion
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Version published atomically, or replay of the current publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPublicationResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/goals:
    post:
      operationId: createGoal
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Goal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '200':
          description: Original result replayed for the same idempotency key and request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/goals/active:
    get:
      operationId: getActiveGoal
      security:
        - cookieSession: []
      responses:
        '200':
          description: Current active goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: SKILLPATH_SESSION
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    GoalTemplateId:
      name: goalTemplateId
      in: path
      required: true
      schema: { type: string }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string }
    Transitive:
      name: transitive
      in: query
      schema: { type: boolean, default: false }
    GraphLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CsrfResponse:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: { type: string }
        parameterName: { type: string }
        token: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, displayName, timezone]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 128, writeOnly: true }
    ProfileResponse:
      type: object
      required: [id, email, displayName, timezone, version]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        timezone: { type: string }
        version: { type: integer, format: int64 }
    GoalTemplateResponse:
      type: object
      required: [id, key, displayName, description]
      properties:
        id: { type: string }
        key: { type: string }
        displayName: { type: string }
        description: { type: string }
    CreateGoalRequest:
      type: object
      required: [goalTemplateId, targetDate, timezone, defaultDailyMinutes]
      properties:
        goalTemplateId: { type: string }
        targetDate: { type: string, format: date }
        timezone: { type: string, maxLength: 64 }
        defaultDailyMinutes: { type: integer, minimum: 30, maximum: 180 }
    GoalResponse:
      type: object
      required: [id, goalTemplateId, targetDate, timezone, defaultDailyMinutes, status, version]
      properties:
        id: { type: string }
        goalTemplateId: { type: string }
        targetDate: { type: string, format: date }
        timezone: { type: string }
        defaultDailyMinutes: { type: integer }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        version: { type: integer, format: int64 }
    KnowledgeNodeResponse:
      type: object
      required: [id, graphVersionId, slug, name, description, category, difficulty, estimatedMinutes, status]
      properties:
        id: { type: string }
        graphVersionId: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        estimatedMinutes: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, ACTIVE, DEPRECATED, ARCHIVED] }
    GoalGraphNode:
      type: object
      required: [id, slug, name, description, category, difficulty, estimatedMinutes, status, relevanceWeight, requiredMastery, terminal]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        difficulty: { type: integer }
        estimatedMinutes: { type: integer }
        status: { type: string }
        relevanceWeight: { type: number, minimum: 0, maximum: 1 }
        requiredMastery: { type: number, minimum: 0, maximum: 1 }
        terminal: { type: boolean }
    KnowledgeEdge:
      type: object
      required: [id, sourceNodeId, targetNodeId, type, strength, status, rationale]
      properties:
        id: { type: string }
        sourceNodeId: { type: string }
        targetNodeId: { type: string }
        type: { type: string, enum: [PREREQUISITE, PART_OF, RELATED, APPLIED_IN] }
        strength: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [ACTIVE, DEPRECATED] }
        rationale: { type: string }
    GoalGraphResponse:
      type: object
      required: [graphVersionId, curriculumKey, versionLabel, publishedAt, nodes, edges, truncated]
      properties:
        graphVersionId: { type: string }
        curriculumKey: { type: string }
        versionLabel: { type: string }
        publishedAt: { type: string, format: date-time }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GoalGraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEdge' }
        truncated: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    GraphViolation:
      type: object
      required: [code, detail, nodePath]
      properties:
        code: { type: string }
        detail: { type: string }
        nodePath:
          type: array
          items: { type: string }
    GraphValidationResponse:
      type: object
      required: [graphVersionId, status, valid, transitioned, violations]
      properties:
        graphVersionId: { type: string }
        status: { type: string, enum: [DRAFT, VALIDATED] }
        valid: { type: boolean }
        transitioned: { type: boolean }
        violations:
          type: array
          items: { $ref: '#/components/schemas/GraphViolation' }
    GraphPublicationResponse:
      type: object
      required: [graphVersionId, curriculumKey, versionLabel, status, publishedAt, replayed]
      properties:
        graphVersionId: { type: string }
        curriculumKey: { type: string }
        versionLabel: { type: string }
        status: { type: string, enum: [PUBLISHED] }
        publishedAt: { type: string, format: date-time }
        replayed: { type: boolean }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
    ApiProblem:
      type: object
      required: [type, title, status, code, detail, instance, correlationId, fieldErrors]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
